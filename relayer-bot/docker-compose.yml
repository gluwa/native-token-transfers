# Local Postgres + Redis for development and the gated integration tests.
#
#   docker compose -f relayer-bot/docker-compose.yml up -d
#   export TEST_DATABASE_URL=postgres://relayer:relayer@localhost:5432/relayer
#   export REDIS_URL=redis://localhost:6379
#   npm test --workspace=relayer-bot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relayer
      POSTGRES_PASSWORD: relayer
      POSTGRES_DB: relayer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayer"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
